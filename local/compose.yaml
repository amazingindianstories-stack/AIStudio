# Local Veevee stack - every backend service, never deployed.
# Managed by local/veevee.sh (generates local/.env with random local-only secrets).
name: veevee-local

x-backend: &backend
  image: veevee-backend:local
  build: { context: .., dockerfile: backend/Dockerfile }
  volumes:
    - ../backend:/app:ro               # live code (restart a service to pick up changes)
    - ./runtime:/opt/veevee-local:ro   # sitecustomize: fake provider routing (local only)
    - media:/media
  environment: &backend-env
    PYTHONPATH: /opt/veevee-local
    DJANGO_SETTINGS_MODULE: config.settings.local
    PYTHONUNBUFFERED: "1"
    VEEVEE_LOCAL_PROVIDERS: ${VEEVEE_LOCAL_PROVIDERS:-fake}
    VEEVEE_MANAGED_PORTRAITS: ${VEEVEE_MANAGED_PORTRAITS:-1}
    VEEVEE_GEMINI_OMNI: ${VEEVEE_GEMINI_OMNI:-1}      # paid guard admits Gemini Omni Flash 1.1 (fake provider here)
    VEEVEE_KLING: ${VEEVEE_KLING:-1}                  # paid guard admits Kling Image 3.0 / 2.1 (fake provider here)
    VEEVEE_FAKE_PROVIDER_URL: http://fake-providers:8099
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
    AUTH_SECRET: ${AUTH_SECRET}
    DJANGO_ALLOWED_HOSTS: 127.0.0.1
    DJANGO_BROWSER_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,https://veevee.ai
    PUBLIC_APP_URL: http://localhost:3000
    VEEVEE_MEDIA_BACKEND: filesystem
    VEEVEE_MEDIA_ROOT: /media
    MOCK_GENERATION: "0"
    MOCK_ASSET_PROVIDER: "0"
    ARK_API_KEY: ${ARK_API_KEY:-local-fake-ark-key}
    GOOGLE_API_KEY: ${GOOGLE_API_KEY:-local-fake-google-key}
    BYTEPLUS_ACCESS_KEY_ID: ${BYTEPLUS_ACCESS_KEY_ID:-local-fake-ak}
    BYTEPLUS_SECRET_ACCESS_KEY: ${BYTEPLUS_SECRET_ACCESS_KEY:-local-fake-sk}
    BYTEPLUS_ARK_REGION: ap-southeast-1
    VEEVEE_PROVIDER_MEDIA_HOSTS: fake-media.invalid
    AWS_EC2_METADATA_DISABLED: "true"
  depends_on:
    db: { condition: service_healthy }
    fake-providers: { condition: service_started }
  restart: unless-stopped

x-worker-env: &worker-env
  <<: *backend-env
  DATABASE_URL: postgresql://goal4_green_preview_worker:${WORKER_DB_PASSWORD}@db:5432/railway
  VEEVEE_LEASE_PREFIX: "lease:g4preview:${VEEVEE_NAMESPACE}:"
  VEEVEE_NAMING_PREFIX: "g4preview:${VEEVEE_NAMESPACE}:"

services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      API_DB_PASSWORD: ${API_DB_PASSWORD}
      WORKER_DB_PASSWORD: ${WORKER_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db-init:/docker-entrypoint-initdb.d:ro
      - ${VEEVEE_SEED_DIR}:/seed:ro
    healthcheck: { test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d railway"], interval: 3s, retries: 400 }
    networks: [internal]
    ports: ["127.0.0.1:55432:5432"]   # local inspection only

  fake-providers:
    image: veevee-backend:local
    volumes: [../backend:/app:ro]
    command: ["python", "-m", "testsupport.fake_provider_server", "8099"]
    networks: [internal, edge]        # edge only so /state and /control are reachable from this machine
    ports: ["127.0.0.1:18099:8099"]   # inspect /state, change /control
    restart: unless-stopped

  api:
    <<: *backend
    command: ["python", "-m", "deploy.entrypoint", "api"]
    environment:
      <<: *backend-env
      DATABASE_URL: postgresql://goal4_green_preview_api:${API_DB_PASSWORD}@db:5432/railway
      VEEVEE_INGRESS_SECRET: ${VEEVEE_INGRESS_SECRET}
      PORT: "18081"
      VEEVEE_EXPORT_ADMISSION: "1"
      VEEVEE_PORTRAIT_LIFECYCLE: "1"
      VEEVEE_PAID_GUARD: ${VEEVEE_PAID_GUARD}
      DEPTH_WORKER_TOKEN: ${DEPTH_WORKER_TOKEN}
    ports: ["127.0.0.1:18081:18081"]
    networks: [internal, edge]

  # The MCP service (opt-in profile): uvicorn behind the gateway in mcp mode, API database role, no provider keys.
  # Start it with `docker compose -f local/compose.yaml --env-file local/.env --profile mcp up -d mcp`, then run the
  # frontend with MCP_API_ORIGIN=http://127.0.0.1:18083 so http://localhost:3000/mcp reaches it.
  mcp:
    <<: *backend
    profiles: [mcp]
    command: ["python", "-m", "deploy.entrypoint", "mcp"]
    environment:
      <<: *backend-env
      DATABASE_URL: postgresql://goal4_green_preview_api:${API_DB_PASSWORD}@db:5432/railway
      VEEVEE_INGRESS_SECRET: ${VEEVEE_INGRESS_SECRET}
      PORT: "18083"
      VEEVEE_MCP: "1"
      VEEVEE_LOCAL_PROVIDERS: ""          # no provider calls here; upload_reference URL imports keep the SSRF-safe fetcher
      MCP_QUOTE_SECRET: ${MCP_QUOTE_SECRET:-local-only-mcp-quote-secret-0000000000000000}
      VEEVEE_PAID_GUARD: ${VEEVEE_PAID_GUARD}
      ARK_API_KEY: ""
      GOOGLE_API_KEY: ""
      BYTEPLUS_ACCESS_KEY_ID: ""
      BYTEPLUS_SECRET_ACCESS_KEY: ""
    ports: ["127.0.0.1:18083:18083"]
    networks: [internal, edge]

  generation:
    <<: *backend
    command: ["python", "-m", "deploy.entrypoint", "generation"]
    # As in production, only the generation worker holds the Kling key (a fixed fake: never a real key here).
    environment: { <<: *worker-env, VEEVEE_PAID_GUARD: "${VEEVEE_PAID_GUARD}", KLING_API: local-fake-kling-key }
    networks: [internal]

  export:
    <<: *backend
    command: ["python", "-m", "deploy.entrypoint", "export"]
    environment: { <<: *worker-env, VEEVEE_EXPORT_ADMISSION: "1" }
    networks: [internal]

  scheduler:
    <<: *backend
    command: ["python", "-m", "deploy.entrypoint", "scheduler"]
    environment: { <<: *worker-env, VEEVEE_PAID_GUARD: "${VEEVEE_PAID_GUARD}" }
    networks: [internal]

networks:
  internal: { internal: true }
  edge: {}

volumes:
  pgdata: {}
  media: {}
