name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Frontend lint, unit tests and production build without backend credentials
        run: python scripts/django-migration/ci-qualification.py web

  django:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: migration
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: veevee_django_migration
        ports:
          - 5432/tcp
        options: >-
          --tmpfs /var/lib/postgresql/data:rw,size=2g
          --health-cmd "pg_isready -U migration -d veevee_django_migration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/constraints-qualified.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libvips42
      - run: python -m pip install -c backend/constraints-qualified.txt -r backend/requirements.txt
      - run: npm ci
      - name: Verify service target, qualify PG16 baseline/adoption and run every Django app test
        env:
          CI_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          CI_POSTGRES_NETWORK: ${{ job.services.postgres.network }}
          CI_POSTGRES_PORT: ${{ job.services.postgres.ports[5432] }}
        run: >-
          python scripts/django-migration/ci-qualification.py backend
          --postgres-container "$CI_POSTGRES_CONTAINER"
          --network "$CI_POSTGRES_NETWORK"
          --port "$CI_POSTGRES_PORT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: django-pg16-qualification
          path: ${{ runner.temp }}/veevee-ci-artifacts
          if-no-files-found: ignore

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: migration
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: veevee_django_migration
        ports:
          - 5432/tcp
        options: >-
          --tmpfs /var/lib/postgresql/data:rw,size=2g
          --health-cmd "pg_isready -U migration -d veevee_django_migration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/constraints-qualified.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libvips42
      - run: python -m pip install -c backend/constraints-qualified.txt -r backend/requirements.txt
      - run: npm ci
      - run: npx playwright install-deps chromium
      - name: Browser suite through Django and independent Python workers
        env:
          CI_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          CI_POSTGRES_NETWORK: ${{ job.services.postgres.network }}
          CI_POSTGRES_PORT: ${{ job.services.postgres.ports[5432] }}
        run: >-
          python scripts/django-migration/ci-qualification.py browser
          --postgres-container "$CI_POSTGRES_CONTAINER"
          --network "$CI_POSTGRES_NETWORK"
          --port "$CI_POSTGRES_PORT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: django-browser-qualification
          path: ${{ runner.temp }}/veevee-ci-artifacts
          if-no-files-found: ignore
