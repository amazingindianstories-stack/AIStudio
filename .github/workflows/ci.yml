name: CI

# Mirrors scripts/release/release_gate.sh on GitHub-hosted runners, plus the
# Playwright suite through Django. Disposable database and mock providers only;
# no repository secret is used.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MIGRATION_TEST_ISOLATED: '1'
      DJANGO_SETTINGS_MODULE: config.settings.test
      DATABASE_URL: postgresql://postgres:disposable@127.0.0.1:5432/veevee_django_migration
      DJANGO_SECRET_KEY: disposable-ci-django-secret-key-0000000000000000
      AUTH_SECRET: disposable-ci-auth-secret-000000000000000000000000
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost,testserver
      MOCK_GENERATION: '1'
      MOCK_ASSET_PROVIDER: '1'
      AWS_EC2_METADATA_DISABLED: 'true'
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_PASSWORD: disposable
          POSTGRES_DB: veevee_django_migration
        ports:
          - 5432:5432
        options: >-
          --tmpfs /var/lib/postgresql:rw,size=2g
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/constraints-qualified.txt
      # Node runs the cross-language password interop test.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libvips42
      - run: python -m pip install -c backend/constraints-qualified.txt -r backend/requirements.txt pyflakes==3.2.0
      - name: Undefined-name scan
        working-directory: backend
        run: |
          if python -m pyflakes apps config deploy parity testsupport 2>&1 | grep -v "/migrations/" | grep "undefined name "; then exit 1; fi
      - name: Django suite
        working-directory: backend
        run: python manage.py test --noinput --parallel 1
      - name: Migrations match the models
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm test
      - run: npm run lint
      - run: npm run build

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      MIGRATION_TEST_ISOLATED: '1'
      DJANGO_SETTINGS_MODULE: config.settings.test
      DATABASE_URL: postgresql://postgres:disposable@127.0.0.1:5432/veevee_django_migration
      DJANGO_SECRET_KEY: disposable-ci-django-secret-key-0000000000000000
      AUTH_SECRET: disposable-ci-auth-secret-000000000000000000000000
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost,testserver
      MOCK_GENERATION: '1'
      MOCK_ASSET_PROVIDER: '1'
      AWS_EC2_METADATA_DISABLED: 'true'
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_PASSWORD: disposable
          POSTGRES_DB: veevee_django_migration
        ports:
          - 5432:5432
        options: >-
          --tmpfs /var/lib/postgresql:rw,size=2g
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/constraints-qualified.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libvips42
      - run: python -m pip install -c backend/constraints-qualified.txt -r backend/requirements.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Playwright suite through Django and the Python workers
        env:
          TMPDIR: ${{ runner.temp }}
        run: python scripts/dev/browser-harness.py
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-suite
          path: |
            ${{ runner.temp }}/browser-qualification
            test-results
            playwright-report
          if-no-files-found: ignore
