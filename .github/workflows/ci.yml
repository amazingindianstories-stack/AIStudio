name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AUTH_SECRET: ci-only-secret
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/veevee_ci
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: veevee_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d veevee_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AUTH_SECRET: ci-only-secret
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/veevee_ci
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:db:setup
      - run: npm run db:migrate:cost-basis
      - run: npm run db:migrate:hierarchical-folders
      - run: npm run db:migrate:generation-naming
      - run: npm run db:verify:production-schema
      - run: npm run db:optimize
      - run: npm run test:db

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: veevee_codex_regression
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d veevee_codex_regression"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AUTH_SECRET: ci-browser-fixture-only
      DATABASE_BACKEND: postgres
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/veevee_codex_regression
      E2E_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/veevee_codex_regression
      E2E_START_SERVER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:db:setup
      - run: npm run db:migrate:hierarchical-folders
      - run: npm run db:migrate:generation-naming
      - run: npm run test:browser
