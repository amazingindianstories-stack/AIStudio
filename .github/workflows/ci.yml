name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  django:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: veevee_django_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d veevee_django_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AUTH_SECRET: ci-only-secret
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/veevee_django_ci
      DJANGO_TEST_MANAGED: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
        env:
          DJANGO_TEST_MANAGED: "0"
      - run: python manage.py test apps --verbosity 1

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AUTH_SECRET: ci-only-secret
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/veevee_ci
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          VITE_API_URL: https://preview-api.example.invalid
          VITE_MEDIA_ORIGIN: https://storage.googleapis.com

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: veevee_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d veevee_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AUTH_SECRET: ci-only-secret
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/veevee_ci
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:db:setup
      - run: npm run db:migrate:cost-basis
      - run: npm run db:optimize
      - run: npm run test:db
